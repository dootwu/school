<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>互動式活動學習單｜新化高中輔導室</title>
  <!-- 引入與原 PDF 手寫書法/文楷風格相近的繁體中文字型 (霞鶩文楷 TC & Noto Serif TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <!-- 引入 jsPDF 用於產生與原 PDF 相同比例的 PDF 檔 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- 引入 Base64 背景圖資料，避免本機直接開啟 file:// 時 Canvas 發生 CORS Tainted 錯誤 -->
  <script src="bg-data.js"></script>

  <style>
    :root {
      --bg-page: #f5ebe4;
      --primary: #6b2c2c;
      --primary-hover: #522020;
      --accent: #758e6e;
      --card-shadow: 0 10px 30px rgba(107, 44, 44, 0.14);
      --font-main: 'LXGW WenKai TC', 'Kaiti TC', 'STKaiti', 'DFKai-SB', 'BiauKai', serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #2c1e1e;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 96px;
    }

    /* 頂部導覽與工具列 */
    .top-bar {
      width: 100%;
      max-width: 680px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      color: var(--primary);
    }

    .brand-badge {
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(107, 44, 44, 0.2);
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .tool-btn:hover {
      background: #fff;
      border-color: var(--primary);
    }

    .hint-banner {
      width: calc(100% - 24px);
      max-width: 640px;
      background: rgba(255, 255, 255, 0.75);
      border-left: 4px solid var(--accent);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #4a3a3a;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* 學習單畫布主容器：鎖定與原 PDF 完全相同的長寬比例 (1747 : 2481) */
    .worksheet-wrapper {
      width: calc(100% - 20px);
      max-width: 640px;
      aspect-ratio: 1747 / 2481;
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      background: #fde7d9;
      container-type: inline-size;
      user-select: none;
    }

    /* 底層 Canvas 背景 */
    #bg-canvas {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* 疊加在 Canvas 上的透明互動輸入欄位 */
    .field-input {
      position: absolute;
      background: transparent;
      border: none;
      border-radius: 6px;
      font-family: var(--font-main);
      font-weight: 700;
      padding: 0.2cqw 0.6cqw;
      margin: 0;
      outline: none;
      resize: none;
      transition: background-color 0.15s;
      line-height: 1.3;
      overflow-y: auto;
    }

    .field-input::placeholder {
      color: rgba(44, 30, 30, 0.42);
      font-weight: 700;
      transition: opacity 0.15s;
    }

    .field-input.meta-field::placeholder {
      color: rgba(107, 44, 44, 0.45);
    }

    .field-input:focus {
      background: rgba(255, 255, 255, 0.45);
      z-index: 10;
    }

    .field-input:focus::placeholder {
      opacity: 0.25;
    }

    /*
      ========================================================
      7 個欄位精準百分比定位 (對應 1747 x 2481 原生座標)
      「班級」與「活動日期」已往左對齊至「一、活動簡介」
      ========================================================
    */

    /* 1. <在此插入標題> */
    #field-title {
      left: 10.02%;
      top: 5.11%;
      width: 79.96%;
      height: 3.45%;
      text-align: center;
      color: #000000;
      font-size: 3.33cqw;
    }

    /* 2. ＜班級＞ (x = 452 / 1747 = 25.87%, w = 415 / 1747 = 23.75%) */
    #field-class {
      left: 25.87%;
      top: 17.30%;
      width: 23.75%;
      height: 2.85%;
      text-align: left;
      color: #6b2c2c;
      font-size: 3.05cqw;
    }

    /* 3. ＜姓名＞ (x = 1154 / 1747 = 66.06%, w = 418 / 1747 = 23.93%) */
    #field-name {
      left: 66.06%;
      top: 17.30%;
      width: 23.93%;
      height: 2.85%;
      text-align: left;
      color: #6b2c2c;
      font-size: 3.05cqw;
    }

    /* 4. ＜日期＞ (x = 458 / 1747 = 26.22%, w = 416 / 1747 = 23.81%) */
    .date-field-wrap {
      position: absolute;
      left: 26.22%;
      top: 20.32%;
      width: 23.81%;
      height: 2.85%;
    }

    #field-date {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      text-align: left;
      color: #6b2c2c;
      font-size: 2.95cqw;
      pointer-events: none;
    }

    #field-date-picker {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
      margin: 0;
      padding: 0;
      z-index: 2;
    }

    .date-field-wrap:focus-within #field-date {
      background: rgba(255, 255, 255, 0.45);
    }

    /* 5. 一、活動簡介：<輸入活動簡介> (Box 1: x=175..1572, y=749..993) */
    #box-intro {
      left: 10.02%;
      top: 30.19%;
      width: 79.96%;
      height: 9.83%;
    }

    /* 6. 二、活動過程：<輸入活動過程> (Box 2: x=175..1572, y=1163..1571) */
    #box-process {
      left: 10.02%;
      top: 46.88%;
      width: 79.96%;
      height: 16.45%;
    }

    /* 7. 三、心得與反思：<輸入心得與反思> (Box 3: x=175..1198, y=1738..2415) */
    #box-reflection {
      left: 10.02%;
      top: 70.05%;
      width: 58.56%;
      height: 27.29%;
    }

    /* 3 個大格子的包裝容器（為了支援垂直置中與多行輸入） */
    .box-container {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.4cqw 2.0cqw;
      border-radius: 1.8cqw;
      border: none;
      transition: background-color 0.15s;
      cursor: text;
    }

    .box-container:focus-within {
      background: rgba(255, 255, 255, 0.25);
      z-index: 10;
    }

    .box-textarea {
      width: 100%;
      max-height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      padding: 0;
      margin: 0;
      font-family: var(--font-main);
      font-weight: 700;
      color: #000000;
      font-size: 3.45cqw;
      line-height: 1.42;
      text-align: center;
      overflow-y: auto;
    }

    .box-container.align-left {
      justify-content: flex-start;
    }

    .box-container.align-left .box-textarea {
      text-align: left;
      height: 100%;
    }

    .box-textarea::placeholder {
      color: rgba(0, 0, 0, 0.42);
      font-weight: 700;
    }

    .box-textarea:focus::placeholder {
      opacity: 0.25;
    }

    /* 底部固定送出操作列 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 250, 246, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(107, 44, 44, 0.15);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 50;
    }

    .bottom-inner {
      width: 100%;
      max-width: 640px;
      display: flex;
      gap: 10px;
    }

    .btn-primary {
      flex: 1;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(107, 44, 44, 0.28);
      transition: transform 0.1s, background-color 0.15s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* 匯出預覽與下載 Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 18, 18, 0.72);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #fffaf6;
      width: 100%;
      max-width: 480px;
      max-height: 92dvh;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      animation: modalIn 0.2s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(107, 44, 44, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .modal-title {
      font-weight: 700;
      font-size: 17px;
      color: var(--primary);
    }

    .modal-close {
      background: rgba(107, 44, 44, 0.08);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      padding: 12px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .save-tip {
      width: 100%;
      background: #eef5ec;
      border: 1px solid #c5dac0;
      color: #2f4b29;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* 修正 Flexbox 裁切問題：確保整張學習單從頭到尾 100% 完整顯示不被遮擋 */
    .preview-img-wrap {
      width: 100%;
      max-width: 360px;
      flex-shrink: 0;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #fde7d9;
    }

    #preview-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    .modal-footer {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(107, 44, 44, 0.12);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #fff;
      flex-shrink: 0;
    }

    .btn-download {
      padding: 13px 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-img {
      background: var(--accent);
      color: #fff;
    }

    .btn-pdf {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 頂部工具列 (已移除框線按鈕) -->
  <header class="top-bar">
    <div class="brand">
      <span class="brand-badge">新化高中輔導室</span>
      <span>互動式活動學習單</span>
    </div>
    <div class="toolbar-actions">
      <button type="button" class="tool-btn" id="btn-align" title="切換三個大框文字置中或靠左">
        <span>📝 對齊：</span><span id="align-label">置中</span>
      </button>
      <button type="button" class="tool-btn" id="btn-fontsize" title="切換文字大小">
        <span>🔠 字級：</span><span id="fontsize-label">適中</span>
      </button>
      <button type="button" class="tool-btn" id="btn-clear" title="清空所有輸入內容">
        <span>🗑️ 重填</span>
      </button>
    </div>
  </header>

  <div class="hint-banner">
    <span>💡 點擊下方學習單上的 <strong>&lt;欄位&gt;</strong> 即可輸入文字。</span>
  </div>

  <!-- 與原 PDF 完全同比例 (1747 : 2481) 的互動式學習單容器 -->
  <main class="worksheet-wrapper" id="worksheet">
    <!-- 背景 Canvas -->
    <canvas id="bg-canvas" width="1747" height="2481"></canvas>

    <!-- 1. <輸入標題> -->
    <input
      type="text"
      id="field-title"
      class="field-input"
      placeholder="<輸入標題>"
      autocomplete="off"
    />

    <!-- 2. ＜班級＞ -->
    <input
      type="text"
      id="field-class"
      class="field-input meta-field"
      placeholder="＜班級＞"
      autocomplete="off"
    />

    <!-- 3. ＜姓名＞ -->
    <input
      type="text"
      id="field-name"
      class="field-input meta-field"
      placeholder="＜姓名＞"
      autocomplete="off"
    />

    <!-- 4. ＜日期＞ (點擊直接彈出日曆選擇器) -->
    <div class="date-field-wrap" title="點擊選擇活動日期">
      <input
        type="text"
        id="field-date"
        class="field-input meta-field"
        placeholder="＜日期＞"
        readonly
        tabindex="-1"
      />
      <input
        type="date"
        id="field-date-picker"
        aria-label="選擇活動日期"
      />
    </div>

    <!-- 5. 一、活動簡介：<輸入活動簡介> -->
    <div class="box-container" id="box-intro" onclick="this.querySelector('textarea').focus()">
      <textarea
        id="field-intro"
        class="box-textarea"
        rows="1"
        placeholder="<輸入活動簡介>"
      ></textarea>
    </div>

    <!-- 6. 二、活動過程：<輸入活動過程> -->
    <div class="box-container" id="box-process" onclick="this.querySelector('textarea').focus()">
      <textarea
        id="field-process"
        class="box-textarea"
        rows="1"
        placeholder="<輸入活動過程>"
      ></textarea>
    </div>

    <!-- 7. 三、心得與反思：<輸入心得與反思> -->
    <div class="box-container" id="box-reflection" onclick="this.querySelector('textarea').focus()">
      <textarea
        id="field-reflection"
        class="box-textarea"
        rows="1"
        placeholder="<輸入心得與反思>"
      ></textarea>
    </div>
  </main>

  <!-- 底部固定操作列 -->
  <div class="bottom-bar">
    <div class="bottom-inner">
      <button type="button" class="btn-primary" id="btn-export">
        <span>✨ 產生學習單</span>
      </button>
    </div>
  </div>

  <!-- 輸出預覽與下載 Modal -->
  <div class="modal-backdrop" id="export-modal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">🎉 學習單已產生！</span>
        <button type="button" class="modal-close" id="modal-close" aria-label="關閉">✕</button>
      </div>
      <div class="modal-body">
        <div class="save-tip">
          📱 手機長按下方圖片直接儲存至相簿。
        </div>
        <div class="preview-img-wrap">
          <img id="preview-img" alt="學習單預覽圖" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-download btn-img" id="btn-share-img">
          📤 分享
        </button>
        <button type="button" class="btn-download btn-pdf" id="btn-download-pdf">
          📄 下載 PDF 檔
        </button>
      </div>
    </div>
  </div>

  <script>
    // 原生高解析度畫布尺寸 (與原 PDF 1746.875 x 2481.25 完全對應)
    const CANVAS_W = 1747;
    const CANVAS_H = 2481;

    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');

    // 載入從原 PDF 提取並移除 <...> 佔位字的高解析度背景圖 (優先使用 Base64 避免 file:// CORS 限制)
    const bgImage = new Image();
    bgImage.onload = () => {
      bgCtx.drawImage(bgImage, 0, 0, CANVAS_W, CANVAS_H);
    };
    bgImage.src = window.BG_CLEAN_DATA_URL || 'bg-clean.png';

    // 欄位 DOM 參照
    const fields = {
      title: document.getElementById('field-title'),
      className: document.getElementById('field-class'),
      studentName: document.getElementById('field-name'),
      date: document.getElementById('field-date'),
      intro: document.getElementById('field-intro'),
      process: document.getElementById('field-process'),
      reflection: document.getElementById('field-reflection'),
    };
    const datePicker = document.getElementById('field-date-picker');

    // 點擊日期時在支援 showPicker 的桌面/手機瀏覽器直接彈出日曆
    datePicker.addEventListener('click', () => {
      if (typeof datePicker.showPicker === 'function') {
        try {
          datePicker.showPicker();
        } catch (e) {}
      }
    });

    datePicker.addEventListener('change', () => {
      if (datePicker.value) {
        fields.date.value = datePicker.value.replace(/-/g, '/');
      } else {
        fields.date.value = '';
      }
      saveDraft();
    });

    const boxContainers = [
      document.getElementById('box-intro'),
      document.getElementById('box-process'),
      document.getElementById('box-reflection'),
    ];

    // 狀態設定（字級僅保留「適中」與「小」）
    let boxAlign = 'center'; // 'center' | 'left'
    const fontScaleSteps = [
      { label: '適中', scale: 1.0, cqw: 3.45 },
      { label: '小', scale: 0.78, cqw: 2.7 },
    ];
    let fontScaleIdx = 0;

    // Textarea 高度自動伸縮（使垂直置中自然運作）
    function autoResizeTextarea(ta) {
      if (boxAlign === 'left') {
        ta.style.height = '100%';
        return;
      }
      ta.style.height = 'auto';
      const parentH = ta.parentElement.clientHeight - 12;
      ta.style.height = Math.min(ta.scrollHeight, parentH) + 'px';
    }

    [fields.intro, fields.process, fields.reflection].forEach(ta => {
      ta.addEventListener('input', () => {
        autoResizeTextarea(ta);
        saveDraft();
      });
    });

    [fields.title, fields.className, fields.studentName, fields.date].forEach(inp => {
      inp.addEventListener('input', saveDraft);
    });

    window.addEventListener('resize', () => {
      [fields.intro, fields.process, fields.reflection].forEach(autoResizeTextarea);
    });

    // 自動儲存與載入草稿
    const STORAGE_KEY = 'shinhua_worksheet_draft_v1';
    function saveDraft() {
      const data = {};
      for (const [k, el] of Object.entries(fields)) {
        data[k] = el.value;
      }
      data.boxAlign = boxAlign;
      data.fontScaleIdx = fontScaleIdx;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function loadDraft() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        for (const [k, el] of Object.entries(fields)) {
          if (typeof data[k] === 'string') el.value = data[k];
        }
        if (fields.date.value) {
          datePicker.value = fields.date.value.replace(/\//g, '-');
        }
        if (data.boxAlign === 'left' || data.boxAlign === 'center') {
          setBoxAlign(data.boxAlign);
        }
        if (typeof data.fontScaleIdx === 'number') {
          fontScaleIdx = fontScaleSteps[data.fontScaleIdx] ? data.fontScaleIdx : 0;
          applyFontScale();
        }
        setTimeout(() => {
          [fields.intro, fields.process, fields.reflection].forEach(autoResizeTextarea);
        }, 50);
      } catch (e) {}
    }

    // 對齊切換
    function setBoxAlign(align) {
      boxAlign = align;
      document.getElementById('align-label').textContent = align === 'center' ? '置中' : '靠左';
      boxContainers.forEach(c => {
        c.classList.toggle('align-left', align === 'left');
      });
      [fields.intro, fields.process, fields.reflection].forEach(autoResizeTextarea);
      saveDraft();
    }

    document.getElementById('btn-align').addEventListener('click', () => {
      setBoxAlign(boxAlign === 'center' ? 'left' : 'center');
    });

    // 字級切換
    function applyFontScale() {
      const step = fontScaleSteps[fontScaleIdx];
      document.getElementById('fontsize-label').textContent = step.label;
      [fields.intro, fields.process, fields.reflection].forEach(ta => {
        ta.style.fontSize = `${step.cqw}cqw`;
        autoResizeTextarea(ta);
      });
      saveDraft();
    }

    document.getElementById('btn-fontsize').addEventListener('click', () => {
      fontScaleIdx = (fontScaleIdx + 1) % fontScaleSteps.length;
      applyFontScale();
    });

    // 清除重填
    document.getElementById('btn-clear').addEventListener('click', () => {
      if (!confirm('確定要清空目前填寫的所有內容嗎？')) return;
      for (const el of Object.values(fields)) {
        el.value = '';
      }
      datePicker.value = '';
      [fields.intro, fields.process, fields.reflection].forEach(autoResizeTextarea);
      saveDraft();
    });

    // =========================================================================
    // Canvas 高解析度合成引擎 (將底圖 + 7 個欄位文字精準繪製到 1747 x 2481 畫布)
    // =========================================================================

    function wrapTextLines(ctx, text, maxWidth) {
      if (!text || !text.trim()) return [];
      const paragraphs = text.replace(/\r\n/g, '\n').split('\n');
      const lines = [];

      for (const para of paragraphs) {
        if (para === '') {
          lines.push('');
          continue;
        }
        let currentLine = '';
        for (const char of para) {
          const testLine = currentLine + char;
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth && currentLine.length > 0) {
            lines.push(currentLine);
            currentLine = char;
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) {
          lines.push(currentLine);
        }
      }
      return lines;
    }

    function drawBoxText(ctx, text, boxRect, options = {}) {
      if (!text || !text.trim()) return;
      const {
        baseFontSize = 64,
        color = '#000000',
        align = 'center',
        paddingX = 44,
        paddingY = 32,
        lineHeightRatio = 1.42,
      } = options;

      const innerX = boxRect.x + paddingX;
      const innerY = boxRect.y + paddingY;
      const innerW = boxRect.w - paddingX * 2;
      const innerH = boxRect.h - paddingY * 2;

      let fontSize = baseFontSize;
      const minFontSize = 26;
      let lines = [];
      let lineHeight = fontSize * lineHeightRatio;

      while (fontSize >= minFontSize) {
        ctx.font = `700 ${fontSize}px "LXGW WenKai TC", "Kaiti TC", "STKaiti", "DFKai-SB", serif`;
        lines = wrapTextLines(ctx, text, innerW);
        lineHeight = fontSize * lineHeightRatio;
        if (lines.length * lineHeight <= innerH || fontSize === minFontSize) {
          break;
        }
        fontSize -= 2;
      }

      ctx.fillStyle = color;
      ctx.textBaseline = 'middle';

      const totalTextH = lines.length * lineHeight;
      let startY;
      if (align === 'center') {
        startY = boxRect.y + (boxRect.h - totalTextH) / 2 + lineHeight / 2;
        ctx.textAlign = 'center';
      } else {
        startY = innerY + lineHeight / 2;
        ctx.textAlign = 'left';
      }

      const drawX = align === 'center' ? boxRect.x + boxRect.w / 2 : innerX;

      lines.forEach((line, i) => {
        const y = startY + i * lineHeight;
        ctx.fillText(line, drawX, y);
      });
    }

    function drawSingleLineField(ctx, text, rect, options = {}) {
      if (!text || !text.trim()) return;
      const {
        baseFontSize = 54,
        color = '#000000',
        align = 'left',
      } = options;

      const cleanText = text.trim();
      let fontSize = baseFontSize;
      const minFontSize = 28;

      while (fontSize >= minFontSize) {
        ctx.font = `700 ${fontSize}px "LXGW WenKai TC", "Kaiti TC", "STKaiti", "DFKai-SB", serif`;
        if (ctx.measureText(cleanText).width <= rect.w || fontSize === minFontSize) {
          break;
        }
        fontSize -= 2;
      }

      ctx.fillStyle = color;
      ctx.textBaseline = 'middle';
      ctx.textAlign = align;

      const drawX = align === 'center' ? rect.x + rect.w / 2 : rect.x;
      const drawY = rect.y + rect.h / 2;
      ctx.fillText(cleanText, drawX, drawY);
    }

    async function renderExportCanvas() {
      if (document.fonts && document.fonts.ready) {
        try {
          await Promise.race([
            document.fonts.ready,
            new Promise(resolve => setTimeout(resolve, 1200)),
          ]);
        } catch (e) {}
      }

      if (!bgImage.complete || bgImage.naturalWidth === 0) {
        await new Promise((resolve) => {
          bgImage.onload = resolve;
          bgImage.onerror = resolve;
        });
      }

      const outCanvas = document.createElement('canvas');
      outCanvas.width = CANVAS_W;
      outCanvas.height = CANVAS_H;
      const ctx = outCanvas.getContext('2d');

      // 1. 先鋪滿原 PDF 底色並繪製高清底圖
      ctx.fillStyle = '#fde7d9';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      if (bgImage.naturalWidth > 0) {
        ctx.drawImage(bgImage, 0, 0, CANVAS_W, CANVAS_H);
      }

      const scaleMul = fontScaleSteps[fontScaleIdx].scale;

      // 2. 繪製上方 4 個單行欄位（對應左對齊調整後的精準座標）
      // (1) <在此插入標題>
      drawSingleLineField(
        ctx,
        fields.title.value,
        { x: 175, y: 132, w: 1397, h: 75 },
        { baseFontSize: 58, color: '#000000', align: 'center' }
      );

      // (2) ＜班級＞ (左對齊後起點 x=457, 寬度 w=405)
      drawSingleLineField(
        ctx,
        fields.className.value,
        { x: 457, y: 429, w: 405, h: 72 },
        { baseFontSize: 54, color: '#6b2c2c', align: 'left' }
      );

      // (3) ＜姓名＞ (起點 x=1158, 寬度 w=414)
      drawSingleLineField(
        ctx,
        fields.studentName.value,
        { x: 1158, y: 429, w: 414, h: 72 },
        { baseFontSize: 54, color: '#6b2c2c', align: 'left' }
      );

      // (4) ＜日期＞ (左對齊後起點 x=464, 寬度 w=406)
      drawSingleLineField(
        ctx,
        fields.date.value,
        { x: 464, y: 504, w: 406, h: 72 },
        { baseFontSize: 52, color: '#6b2c2c', align: 'left' }
      );

      // 3. 繪製下方 3 個大格子多行內容
      const baseBoxFontSize = Math.round(62 * scaleMul);

      // (5) 一、活動簡介 (Box 1: x=175, y=749, w=1397, h=244)
      drawBoxText(
        ctx,
        fields.intro.value,
        { x: 175, y: 749, w: 1397, h: 244 },
        { baseFontSize: baseBoxFontSize, color: '#000000', align: boxAlign }
      );

      // (6) 二、活動過程 (Box 2: x=175, y=1163, w=1397, h=408)
      drawBoxText(
        ctx,
        fields.process.value,
        { x: 175, y: 1163, w: 1397, h: 408 },
        { baseFontSize: baseBoxFontSize, color: '#000000', align: boxAlign }
      );

      // (7) 三、心得與反思 (Box 3: x=175, y=1738, w=1023, h=677)
      drawBoxText(
        ctx,
        fields.reflection.value,
        { x: 175, y: 1738, w: 1023, h: 677 },
        { baseFontSize: baseBoxFontSize, color: '#000000', align: boxAlign }
      );

      return outCanvas;
    }

    // =========================================================================
    // 產生學習單預覽、純圖片分享、下載同比例 PDF
    // =========================================================================
    const exportModal = document.getElementById('export-modal');
    const previewImg = document.getElementById('preview-img');
    let latestCanvas = null;
    let latestJpegDataUrl = '';

    function getExportFileName(ext) {
      const name = fields.studentName.value.trim() || '同學';
      const title = fields.title.value.trim() || '活動學習單';
      return `${title}_${name}.${ext}`;
    }

    document.getElementById('btn-export').addEventListener('click', async () => {
      latestCanvas = await renderExportCanvas();
      // 採用高品質 JPEG (0.95) 兼顧清晰畫質、手機相簿長按儲存與 LINE 分享速度
      latestJpegDataUrl = latestCanvas.toDataURL('image/jpeg', 0.95);
      previewImg.src = latestJpegDataUrl;
      exportModal.classList.add('open');
    });

    document.getElementById('modal-close').addEventListener('click', () => {
      exportModal.classList.remove('open');
    });

    exportModal.addEventListener('click', (e) => {
      if (e.target === exportModal) {
        exportModal.classList.remove('open');
      }
    });

    // 📤 分享按鈕：單純分享圖片檔案（不帶文字標題，避免 LINE 多傳一段文字），若電腦不支援則直接下載圖片
    document.getElementById('btn-share-img').addEventListener('click', () => {
      if (!latestCanvas) return;
      latestCanvas.toBlob(async (blob) => {
        if (!blob) return;
        const fileName = getExportFileName('jpg');
        const file = new File([blob], fileName, { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            // 只傳入 files，不傳入 title / text，確保純圖片分享
            await navigator.share({ files: [file] });
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }

        // 備援：若瀏覽器不支援原生分享，則直接觸發下載圖片
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = fileName;
        link.href = url;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      }, 'image/jpeg', 0.95);
    });

    // 📄 下載 PDF 檔：產生與原 PDF 同比例 (419.25 x 595.5 pt) 的檔案，並解決手機瀏覽器不彈出下載視窗的問題
    document.getElementById('btn-download-pdf').addEventListener('click', async () => {
      if (!latestCanvas || !latestJpegDataUrl) return;
      const jspdfNs = window.jspdf;
      if (!jspdfNs || !jspdfNs.jsPDF) {
        alert('PDF 套件載入中，請稍後再試。');
        return;
      }

      const pdfW = 419.25;
      const pdfH = 595.5;
      const pdf = new jspdfNs.jsPDF({
        orientation: 'portrait',
        unit: 'pt',
        format: [pdfW, pdfH],
      });

      pdf.addImage(latestJpegDataUrl, 'JPEG', 0, 0, pdfW, pdfH);
      const fileName = getExportFileName('pdf');
      const pdfBlob = pdf.output('blob');

      // 在 iOS / Android 手機瀏覽器（特別是 LINE 內建瀏覽器或 Safari），使用原生檔案選單可穩定「儲存到檔案」或傳送至 LINE
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile && navigator.canShare) {
        const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });
        if (navigator.canShare({ files: [pdfFile] })) {
          try {
            await navigator.share({ files: [pdfFile] });
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }
      }

      // 電腦端或一般下載：使用 Blob URL 觸發瀏覽器下載視窗
      const blobUrl = URL.createObjectURL(pdfBlob);
      const link = document.createElement('a');
      link.href = blobUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    });

    // 初始化載入草稿
    loadDraft();
  </script>
</body>
</html>
